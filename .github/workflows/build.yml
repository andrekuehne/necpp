name: Build WASM

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel an obsolete build when newer commits arrive on the same branch/PR.
concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Build NEC++ WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build optimized WASM
        run: ./scripts/build_wasm_docker.sh

      - name: Prepare package artifacts
        shell: bash
        run: |
          test -s nec2pp.js
          test -s nec2pp.wasm

          mkdir -p wasm-dist
          cp nec2pp.js nec2pp.wasm wasm-dist/

          sha256sum \
            wasm-dist/nec2pp.js \
            wasm-dist/nec2pp.wasm \
            > wasm-dist/SHA256SUMS

          echo "Generated artifacts:"
          ls -lh wasm-dist

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: necpp-wasm
          path: wasm-dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
